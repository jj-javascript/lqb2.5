name: Tests

# Runs the import-pipeline unit tests (pytest) and the bookshelf E2E tests
# (Playwright) on every push and pull request, so template/JS/importer
# changes that would fail at runtime are caught before deploy.
on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow pyyaml pytest

      - name: Run import pipeline tests
        run: python -m pytest tests/python -q

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Global setup injects the fixture books, builds the site into
      # _site_test/ with the test config override, and the webServer
      # serves it on http://127.0.0.1:4173.
      - name: Run bookshelf E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
