name: Shelf import

# Event-driven only. The RSS-to-webhook bridge (IFTTT/Zapier RSS trigger on
# the #special-books feed) fires a repository_dispatch event of type
# goodreads-special-books; there is no scheduled poll. workflow_dispatch is
# the manual re-trigger / fallback if the bridge silently dies.
#
# Bridge setup (IFTTT or Zapier): on new feed item, POST
#   https://api.github.com/repos/<owner>/<repo>/dispatches
#   {"event_type": "goodreads-special-books"}
# with Authorization: token <PAT with repo scope>. The payload content is
# ignored; every run re-fetches the full feed and diffs it against the CMS.
on:
  repository_dispatch:
    types: [goodreads-special-books]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow pyyaml

      - name: Run shelf import
        env:
          GOODREADS_SHELF: special-books
        run: python import_shelf.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _books _tags assets/images/books
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: import Goodreads #special-books shelf"
            git push
          fi
