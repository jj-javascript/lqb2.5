# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: lqb2 & co.
email: lawrence@lqb2.co
description: >- # this means to ignore newlines until "baseurl:"
  transform yourself, transform the world — grace lee boggs
baseurl: "" # production (lqb2.co)
url: "https://www.lqb2.co" # production (lqb2.co)
icon: /assets/images/icon-512.png
twitter_username: lqb2
github_username:  lqb2

# Build settings
markdown: kramdown

# Exclude from processing.
# A custom `exclude` list replaces Jekyll 3.10's defaults; it does not extend
# them. The defaults are repeated first so a checkout with gems in
# vendor/bundle (ruby/setup-ruby's bundler cache on CI) is not read as site
# content. The test config must not set its own `exclude` — that array would
# replace this one. See tests/fixtures/_config_test.yml.

plugins:
  - jekyll-paginate

collections:
  books:
    output: false
  # Goodreads shelves mirrored as tags. `site.tags` is Jekyll's post-tag
  # index, so these documents are read via site.collections, not site.tags.
  tags:
    output: false

paginate: 1
paginate_path: "/page/:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - harvest.py
  - import_queue.py
  - harvest-report.txt
  - verify-build.sh
  - tests
  - package.json
  - package-lock.json
  - playwright.config.ts
  - playwright-report
  - test-results
